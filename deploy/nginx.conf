events {
    worker_connections 1024;
}

http {
    # Default load-balancing strategy is round-robin: request 1 -> rl1,
    # request 2 -> rl2, request 3 -> rl3, request 4 -> rl1, ... This is
    # deliberate for Phase 5's proof: if the global limit only holds
    # because requests happen to land on the same instance, round-robin
    # would immediately expose that. Since all 3 instances share the same
    # Redis, the limit holds regardless of which instance handles which
    # request.
    upstream rate_limiter_backend {
        server rl1:8000;
        server rl2:8000;
        server rl3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rate_limiter_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}