version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # exposed to host so you can poke at it with redis-cli while debugging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Three identical instances of the SAME service. None of them know about
  # each other -- they only share Redis. This is the actual proof of
  # spec section 3/5: statelessness + shared external state = correct
  # global limits, without the instances coordinating directly at all.
  rl1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy

  rl2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy

  rl3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"  # single entrypoint clients actually talk to
    depends_on:
      - rl1
      - rl2
      - rl3